services:
  # === MySQL Database ===
  mariadb:
    build:
      context: ./mariadb
      dockerfile: Dockerfile
    container_name: scc-mariadb
    env_file:
      - ./mariadb/.env
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql                      # постоянное хранилище БД
    restart: unless-stopped
    # 🔍 Healthcheck: проверка доступности MariaDB
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p$$MARIADB_ROOT_PASSWORD$"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    container_name: scc-rabbitmq
    ports:
      - "5672:5672"
    restart: unless-stopped
    # 🔍 Healthcheck: проверка работоспособности RabbitMQ
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping", "--quiet"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: scc-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: scc-asterisk
    ports:
      - "5060:5060/udp" 
      - "5038:5038"
      - "10000-10100:10000-10100/udp"
      - "8088:8088"
      - "8089:8089"
    volumes:
      - asterisk_sounds:/var/lib/asterisk/sounds
      - asterisk_log:/var/log/asterisk
      - asterisk_monitor:/var/spool/asterisk/monitor
    restart: unless-stopped
    # 🔍 Healthcheck: проверка готовности Asterisk
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: scc-app
    env_file:
      - ./app/.env
    depends_on:
      asterisk:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  app_ami:
    build: 
      context: ./app_ami
      dockerfile: Dockerfile
    container_name: scc-app_ami
    env_file:
      - ./app_ami/.env
    depends_on:
      asterisk:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  app_call:
    build: 
      context: ./app_call
      dockerfile: Dockerfile
    container_name: scc-app_call
    env_file:
      - ./app_call/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app_db:
    build: 
      context: ./app_db
      dockerfile: Dockerfile
    container_name: scc-app_db
    env_file:
      - ./app_db/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  app_new_call:
    build: 
      context: ./app_new_call
      dockerfile: Dockerfile
    container_name: scc-app_new_call
    env_file:
      - ./app_new_call/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  app_rcv_trns:
    build: 
      context: ./app_rcv_trns
      dockerfile: Dockerfile
    container_name: scc-app_rcv_trns
    env_file:
      - ./app_rcv_trns/.env
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  app_snd_trns:
    build: 
      context: ./app_snd_trns
      dockerfile: Dockerfile
    container_name: scc-app_snd_trns
    env_file:
      - ./app_snd_trns/.env
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
  asterisk_sounds:
  asterisk_log:
  asterisk_monitor: