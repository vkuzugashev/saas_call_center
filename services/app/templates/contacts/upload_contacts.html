<!-- upload_contacts.html -->
{% extends 'base.html' %}

{% block title %}Загрузка контактов{% endblock %}

{% block content %}
<h1>Загрузка контактов</h1>

<form method="POST" enctype="multipart/form-data">
   <div class="mb-3">
       <label for="file" class="form-label">Выберите файл</label>
       <input type="file" name="file" id="file" class="form-control" required>
       <small class="form-text text-muted">Поддерживается только формат CSV.</small>
   </div>
   <button type="submit" class="btn btn-primary">Загрузить</button>
</form>
{% endblock %}
