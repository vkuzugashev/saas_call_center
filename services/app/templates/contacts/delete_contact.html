<!-- delete_contact.html -->
{% extends 'base.html' %}

{% block title %}Удаление контакта{% endblock %}

{% block content %}
<h1>Удаление контакта</h1>

<p>Вы уверены, что хотите удалить контакт {{ contact.name }}?</p>

<form action="{{ url_for('contacts_bp.delete_contact', id=contact.id) }}" method="POST">
   <button type="submit" class="btn btn-danger">Удалить</button>
</form>
{% endblock %}
