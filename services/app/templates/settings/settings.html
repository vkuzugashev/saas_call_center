{% extends 'base.html' %}

{% block title %}Настройки системы{% endblock %}

{% block content %}
<h1>Настройки системы</h1>

<h2>Модули</h2>
<div class="mb-3">
   {% if modules %}
   {% for module, enabled in modules.items() %}
   <div class="form-check">
      <input 
         class="form-check-input" 
         type="checkbox" 
         id="mod-{{ module }}" 
         name="modules" 
         value="{{ module }}" 
         {% if enabled %}checked{% endif %}
      >
      <label class="form-check-label" for="mod-{{ module }}">{{ module }}</label>
   </div>
   {% endfor %}
   {% else %}
   <p>Нет доступных модулей.</p>
   {% endif %}
</div>

{% endblock %}
