{% extends 'base.html' %}

{% block title %}Категории звонков{% endblock %}

{% block content %}
<h1>Категории звонков</h1>
<div class="row">
    <form method="POST" class="d-flex align-items-center">
        <div class="mb-6 d-flex align-items-center">
            <label for="name" class="form-label me-2">Категория:</label>
            <input type="text" class="form-control me-2" id="name" name="name" required>
            <button type="submit" class="btn btn-primary">Добавить</button>
        </div>
    </form>
</div>
<div class="row">&nbsp;</div>
<div class="row">
    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Название</th>
                <th scope="col">Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.id }}</td>
                <td>{{ category.name }}</td>
                <td>
                    <a href="{{ url_for('categories_bp.edit_call_category', id=category.id) }}"
                        class="btn btn-primary btn-sm">Редактировать</a>
                    <a href="{{ url_for('categories_bp.delete_call_category_confirmation', id=category.id) }}"
                        class="btn btn-danger">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
