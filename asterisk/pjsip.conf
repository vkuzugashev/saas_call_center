; PJSIP Configuration Samples and Quick Reference
;

; UDP transport behind NAT
;
[transport-udp-nat]
type=transport
protocol=udp
bind=0.0.0.0
local_net=127.0.0.0/24

; заменить на свои адреса
;local_net=172.17.0.0/24
external_media_address = 192.168.1.101
external_signaling_address = 192.168.1.101

[internal-endpoint](!)
type=endpoint
context=internal
disallow=all
allow=!all,alaw,ulaw
transport=transport-udp-nat
media_address = 192.168.1.101 ; требуется задать внешний IP адресс
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
language=ru

[internal-auth](!)
type=auth
auth_type=userpass

[internal-aor](!)
type=aor
max_contacts=2
qualify_frequency=60


[user1](internal-endpoint)
auth=user1
aors=user1

[user1](internal-auth)
username=user1
password=789123

[user1](internal-aor)

[user2](internal-endpoint)
auth=user2
aors=user2

[user2](internal-auth)
username=user2
password=356123

[user2](internal-aor)
