[queue operators]
exten => 1,1,Answer() 
   same => n,Playback(conf-now-recording)
   ;same => n,Set(fname=${STRFTIME(${EPOCH},,%Y-%m-%d-%H-%M%S)}-${CALLERID(num)}-${CONNECTEDLINE(num)})
   ;same => n,Set(fname_folder=${STRFTIME(${EPOCH},,%Y)}/${STRFTIME(${EPOCH},,%m)}/${STRFTIME(${EPOCH},,%d)})
   ;same => n,Set(MONITOR_FILENAME=${fname_folder}/${fname})
   ;same => n,MixMonitor(record/${fname}.wav,br(record-in/${fname}.wav),t(record-out/${fname}.wav))
   ;same => n,Queue(operator)
   same => n,Queue(operator,,,,,,,sub-macro1)
   ;same => n,Queue(operator,M(recordcalls))
   same => n,Hangup() 

[sub-macro1]   
exten => s,1,Verbose(Call macro 1)
   ;same => n,Verbose(${CALLERID(all)})
   ;same => n,Verbose(${CONNECTEDLINE(all)})
   ;same => n,Verbose(${CHANNEL(CALLERID)})
   ;same => n,Verbose(${CHANNEL(CONNECTEDLINE)})
   ;same => n,Verbose(${CHANNEL(name)})
   same => n,Set(connectedlinetemp=${CUT(CHANNEL,/,2)})
   same => n,Set(connectedline=${CUT(connectedlinetemp,-,1)})
   ;same => n,Verbose(${connectedline})
   ;same => n,Verbose(${CHANNEL})
   same => n,Set(fname=${STRFTIME(${EPOCH},,%Y-%m-%d-%H-%M-%S)}-${CONNECTEDLINE(number)}-${connectedline}-${UNIQUEID})
   same => n,Set(fname_folder=${STRFTIME(${EPOCH},,%Y)}/${STRFTIME(${EPOCH},,%m)}/${STRFTIME(${EPOCH},,%d)})
   ;same => n,System(mkdir -p /var/spool/asterisk/monitor/${fname_folder})
   same => n,MixMonitor(${fname_folder}/${fname}.wav,br(${fname_folder}/${fname}-in.wav)bt(${fname_folder}/${fname}-out.wav))
   same => n,Return()

[operators]
exten => oper1,1,Answer()
   same => n,Playback(conf-now-recording)
;   same => n,MixMonitor(record.wav,br(record-in.wav)t(record-out.wav))
   same => n,Set(fname=${STRFTIME(${EPOCH},,%Y-%m-%d-%H-%M%S)}-${CALLERID(num)}-${EXTEN})
   same => n,Set(fname_folder=${STRFTIME(${EPOCH},,%Y)}/${STRFTIME(${EPOCH},,%m)}/${STRFTIME(${EPOCH},,%d)})
   same => n,MixMonitor(${fname_folder}/${fname}.wav,br(${fname_folder}/${fname}-in.wav)bt(${fname_folder}/${fname}-out.wav))
   same => n,Dial(PJSIP/oper1,5)
   same => n,Playback(telephone-number&vm-isunavail)
   same => n,Queue(operator) 

exten => oper2,1,Answer()
