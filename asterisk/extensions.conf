
[general]

[global]

[internal]
exten => 01,1,Goto(start,01,1)

[start]  
exten => 01,1,Background(basic-pbx-ivr-main)
   same => n,WaitExten(8)
   same => n,Background(vm-repeat)
   same => n,WaitExten(5)
   same => n,Playback(goodbye)  
   same => n,Hangup()

      exten => 1,1,Playback(digits/1)
         same => n,Goto(sales department,1,2) 

      exten => 2,1,Playback(digits/2)
         same => n,Goto(technical support,1,2)

      exten => 3,1,Playback(digits/3)
         same => n,Goto(finance department,1,2)

      exten => 4,1,Playback(digits/4)
         same => n,Goto(employee catologist,1,2)   

      exten => 5,1,Playback(digits/5)
         same => n,Goto(internal,01,2)

      exten => 0,1,Playback(digits/0)
         same => n,Goto(queue operators,1,2)   

      exten => 101,1,Playback(digits/91)
         same => n,Goto(operators,101,2)   

      exten => 92,1,Playback(digits/92)`
         same => n,Goto(operators,102,2)     

