<html>

<script src="https://jssip.net/download/releases/jssip-3.10.0.min.js"></script>
<script>
 // Create our JsSIP instance and run it:

var socket = new JsSIP.WebSocketInterface('wss://localhost:8089');
var configuration = {
  sockets  : [ socket ],
  uri      : 'sip:200@90.156.206.67',
  username : 'penart',
  password : 'panama'
};

var ua = new JsSIP.UA(configuration);

ua.start();

// Register callbacks to desired call events
var eventHandlers = {
  'progress': function(e) {
    console.log('call is in progress');
  },
  'failed': function(e) {
    console.log('call failed with cause: '+ e.data.cause);
  },
  'ended': function(e) {
    console.log('call ended with cause: '+ e.data.cause);
  },
  'confirmed': function(e) {
    console.log('call confirmed');
  }
};

var options = {
  'eventHandlers'    : eventHandlers,
  'mediaConstraints' : { 'audio': true, 'video': true }
};

var session = ua.call('sip:101@90.156.206.67', options);
</script>
</html>
